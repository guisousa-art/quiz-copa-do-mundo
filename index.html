<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Quiz da Copa do Mundo 2026 — Teste seus conhecimentos sobre bandeiras e curiosidades do futebol mundial!">
  <link rel="icon" type="image/svg+xml" href="assets/g1_logo.svg">
  <title>Quiz Copa do Mundo 2026</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
</head>

<body>
  <!-- START SCREEN -->
  <div id="screen-start" class="screen active">
    <div class="start-container">
      <div class="start-logo">
        <img src="assets/g1_logo.svg" alt="g1" class="logo-g1">
        <h1 class="logo-text">Quiz<br>Copa do Mundo</h1>
        <span class="logo-year">2026</span>
      </div>
      <p class="start-subtitle">Teste seus conhecimentos sobre<br>as bandeiras das seleções<br>que competirão esse ano
      </p>

      <button id="btn-start" class="btn-primary" style="margin-bottom: 8px;">
        <span>Começar</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14" />
          <path d="m12 5 7 7-7 7" />
        </svg>
      </button>

      <button id="btn-album" class="btn-album">
        <span class="material-symbols-outlined" style="font-size: 1.25rem;">collections_bookmark</span>
        <span>Veja quais bandeiras conquistou!!</span>
      </button>

      <!-- 
      <div class="mode-container">
        <div class="mode-selector">
          <h3>Escolha um modo:</h3>
          <button id="btn-mode-flags" class="mode-btn active" data-mode="flags">
            <span class="mode-icon">🏴</span>
            <div class="mode-text">
              <span class="mode-label">Bandeiras</span>
              <span class="mode-desc">Identifique o país pela bandeira</span>
            </div>
          </button>
          
          <button id="btn-mode-shields" class="mode-btn" data-mode="shields">
            <span class="mode-icon">🛡️</span>
            <div class="mode-text">
              <span class="mode-label">Escudos</span>
              <span class="mode-desc">Identifique a seleção pelo escudo</span>
            </div>
          </button>
          
          <button id="btn-mode-trivia" class="mode-btn" data-mode="trivia">
            <span class="mode-icon">🧠</span>
            <div class="mode-text">
              <span class="mode-label">Curiosidades</span>
              <span class="mode-desc">Perguntas sobre Copas passadas</span>
            </div>
          </button>
        </div>
      </div>
      -->
    </div>
  </div>

  <!-- ALBUM SCREEN -->
  <div id="screen-album" class="screen">
    <div class="album-container">
      <header class="album-header">
        <button id="btn-album-back" class="album-back-btn" aria-label="Voltar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>
        <div class="album-title-group">
          <h2 class="album-title">Álbum de Bandeiras</h2>
          <span id="album-progress" class="album-progress">0/48 figurinhas</span>
        </div>
      </header>
      <div id="album-grid" class="album-grid">
        <!-- Stickers injected by JS -->
      </div>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="screen-quiz" class="screen">
    <div class="quiz-container">
      <header class="quiz-header">
        <div class="quiz-progress">
          <span id="question-counter" class="counter">1/12</span>
          <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
        </div>
        <div id="timer-display" class="timer">
          <svg class="timer-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
          <span id="timer-value">15s</span>
        </div>
      </header>

      <div class="quiz-body">
        <div class="level-badge" id="level-badge">Nível 1</div>
        <h2 id="question-text" class="question-text">De qual país é esta bandeira?</h2>

        <div id="media-container" class="media-container">
          <div id="flag-display" class="flag-display"></div>
        </div>

        <div id="options-container" class="options-container">
          <!-- Options will be injected here -->
        </div>
      </div>

      <div id="feedback-overlay" class="feedback-overlay hidden">
        <div class="feedback-content">
          <div id="feedback-icon" class="feedback-icon"></div>
          <p id="feedback-text" class="feedback-text"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="screen-results" class="screen">
    <div class="results-container">
      <div class="results-header">
        <div id="results-emoji" class="results-emoji">🏆</div>
        <h2 id="results-title">Parabéns!</h2>
        <p id="results-subtitle" class="results-subtitle">Você é um craque!</p>
      </div>

      <div class="score-card">
        <div class="score-ring-container">
          <svg class="score-ring" viewBox="0 0 120 120">
            <circle class="score-ring-bg" cx="60" cy="60" r="52" />
            <circle id="score-ring-fill" class="score-ring-fill" cx="60" cy="60" r="52" />
          </svg>
          <div class="score-ring-text">
            <span id="score-percent" class="score-percent">0%</span>
          </div>
        </div>
        <div class="score-details">
          <div class="score-stat">
            <span class="stat-icon correct">✓</span>
            <span class="stat-label">Acertos</span>
            <span id="stat-correct" class="stat-value">0</span>
          </div>
          <div class="score-stat">
            <span class="stat-icon wrong">✗</span>
            <span class="stat-label">Erros</span>
            <span id="stat-wrong" class="stat-value">0</span>
          </div>
          <div class="score-stat">
            <span class="stat-icon time"><span class="material-symbols-outlined"
                style="font-size: 1.2rem;">timer</span></span>
            <span class="stat-label">Tempo médio</span>
            <span id="stat-avg-time" class="stat-value">0s</span>
          </div>
        </div>
      </div>

      <div class="results-actions">
        <button id="btn-restart" class="btn-primary">
          <span>Jogar Novamente</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10" />
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
          </svg>
        </button>
        <div class="share-wrapper">
          <button id="btn-share" class="btn-secondary">
            <span>Compartilhar</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3" />
              <circle cx="6" cy="12" r="3" />
              <circle cx="18" cy="19" r="3" />
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
            </svg>
          </button>

          <div id="share-menu" class="share-menu hidden">
            <button id="share-whatsapp" class="share-menu-item">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
              </svg>
              <span>WhatsApp</span>
            </button>
            <button id="share-twitter" class="share-menu-item">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z" />
              </svg>
              <span>X</span>
            </button>
            <button id="share-instagram" class="share-menu-item">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" />
              </svg>
              <span>Instagram</span>
            </button>
            <button id="share-copy" class="share-menu-item">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
              </svg>
              <span>Copiar</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
